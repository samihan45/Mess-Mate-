  <path d="M100 462l-9 17h18Z" fill="#4b8c51"/><circle cx="100" cy="460" r="7" fill="#4b8c51" stroke="#fff" stroke-width="3"/>
  <path d="M226 465l-9 17h18Z" fill="#e18b45"/><circle cx="226" cy="463" r="7" fill="#e18b45" stroke="#fff" stroke-width="3"/>
