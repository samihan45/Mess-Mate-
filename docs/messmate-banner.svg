<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">MessMate — Discover your next meal</title>
<desc id="desc">A student-focused mess discovery app banner showing a mobile app interface with nearby mess listings, food menu cards, map pins and crowd status.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b22"/><stop offset=".58" stop-color="#174432"/><stop offset="1" stop-color="#24563d"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f58b"/><stop offset="1" stop-color="#a9dc56"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#f3f4e9"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071b12" flood-opacity=".38"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#d8efb2" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1600" height="620" rx="34" fill="url(#bg)"/>
<rect width="1600" height="620" rx="34" fill="url(#grid)"/>
<circle cx="1350" cy="300" r="330" fill="#c6e87b" opacity=".055"/>
<circle cx="1130" cy="70" r="170" fill="#fff4d6" opacity=".035"/>
<g transform="translate(112 94)">
  <rect x="0" y="0" width="58" height="58" rx="18" fill="url(#lime)"/>
  <path d="M15 31h28l-4 13H19Z" fill="#173b2c"/>
  <path d="M19 27q10-10 20 0" fill="none" stroke="#173b2c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M23 20q-4-6 1-10m11 10q-4-6 1-10" fill="none" stroke="#173b2c" stroke-width="3" stroke-linecap="round"/>
  <text x="76" y="43" fill="#fff9eb" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" letter-spacing="-1.8">MessMate</text>
  <rect x="2" y="91" width="86" height="5" rx="3" fill="#c9ed75"/>
  <text x="0" y="164" fill="#d9f18a" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="3">MADE FOR THE STUDENT LIFE</text>
  <text x="0" y="235" fill="#fff9eb" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" letter-spacing="-2">Hungry?</text>
  <text x="0" y="300" fill="#fff9eb" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="800" letter-spacing="-2">Find your mess.</text>
  <text x="2" y="355" fill="#dce8d9" font-family="Arial,Helvetica,sans-serif" font-size="22">Explore nearby messes, check today's menu,</text>
  <text x="2" y="389" fill="#dce8d9" font-family="Arial,Helvetica,sans-serif" font-size="22">compare prices and beat the lunch rush.</text>
  <g transform="translate(0 438)">
    <rect width="192" height="48" rx="24" fill="url(#lime)"/>
    <text x="96" y="31" text-anchor="middle" fill="#173b2c" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" letter-spacing=".5">DISCOVER • EAT • REPEAT</text>
  </g>
</g>
