<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">MessMate — Find good food. Skip the guesswork.</title>
<desc id="desc">A modern green and cream banner for a student food discovery platform, with a food bowl illustration and floating discovery, menu and crowd cards.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102d24"/><stop offset="1" stop-color="#1c4937"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8f47a"/><stop offset="1" stop-color="#a8d94f"/></linearGradient>
  <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5df"/><stop offset="1" stop-color="#e8d7b8"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#061a13" flood-opacity=".28"/></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#d8f47a" opacity=".18"/></pattern>
</defs>
<rect width="1600" height="520" rx="34" fill="url(#bg)"/>
<rect width="1600" height="520" rx="34" fill="url(#dots)"/>
<circle cx="1290" cy="240" r="250" fill="#b6df64" opacity=".07"/>
