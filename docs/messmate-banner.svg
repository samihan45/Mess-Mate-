  <path d="M27 25 Q22 18 28 13 M39 25 Q34 17 41 11" fill="none" stroke="#173b2d" stroke-width="3.5" stroke-linecap="round"/>
  <text x="88" y="48" fill="#fff8e9" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">MessMate</text>
  <rect x="2" y="105" width="94" height="5" rx="3" fill="#c9eb70"/>
  <text x="0" y="177" fill="#d9f17e" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3">YOUR FOOD. YOUR NEIGHBOURHOOD.</text>
  <text x="0" y="240" fill="#fff8e9" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-1">Find good food.</text>
  <text x="0" y="292" fill="#fff8e9" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-1">Skip the guesswork.</text>
  <text x="2" y="348" fill="#d7e4d8" font-family="Arial, Helvetica, sans-serif" font-size="21">Discover local messes, explore daily menus</text>
  <text x="2" y="379" fill="#d7e4d8" font-family="Arial, Helvetica, sans-serif" font-size="21">and check crowd updates before you go.</text>
</g>
