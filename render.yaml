# Render.com blueprint (optional). Any host with Node 20+ and PostgreSQL works.
databases:
  - name: messmate-db
    plan: free
services:
  - type: web
    name: messmate-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: messmate-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false   # set to your static site URL
      - key: PUBLIC_APP_URL
        sync: false
  - type: web
    name: messmate-client
    runtime: static
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set to the API URL, e.g. https://messmate-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
