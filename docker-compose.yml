# Local alternative to a hosted database: `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: messmate
      POSTGRES_PASSWORD: messmate_local
      POSTGRES_DB: messmate
    ports:
      - "5432:5432"
    volumes:
      - messmate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messmate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  messmate_pg:
