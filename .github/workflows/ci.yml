name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: messmate
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: messmate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U messmate"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://messmate:ci_only_password@localhost:5432/messmate?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run build -w server
      - run: npm run test -w server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm run build -w client
      - run: npm run test -w client
